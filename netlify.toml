# Netlify configuration for DPR Analyzer Pro.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22 ships native WebSocket, which @supabase/realtime-js needs.
  # On Node 20 the realtime client throws at createClient() construction
  # time, breaking every function that touches Supabase.
  NODE_VERSION = "22"

# /api/* paths are claimed natively by the v2 functions via their
# `export const config = { path: '/api/...' }` declarations. We
# deliberately do NOT add a redirect here: a `/api/* → /.netlify/functions/:splat`
# rewrite would break subdirectory functions (e.g. admin/grant-credits)
# because Netlify deploys those by basename, not by relative path.

# Canonical domain — the portal lives on dpranalyzer.com only. Any visit to
# the default Netlify subdomain is permanently redirected there, keeping the
# path, query and #hash (so a Supabase auth hash still completes sign-in on
# the right domain). Deploy previews (deploy-preview-N--…) use a different
# host and are unaffected. Must stay ABOVE the SPA fallback: Netlify applies
# the first matching rule.
[[redirects]]
  from = "https://aurisdprfrontver1.netlify.app/*"
  to = "https://dpranalyzer.com/:splat"
  status = 301
  force = true

# Second domain (dpranalyzerpro.com, with and without www) is an alias that
# forwards to the main address, so logins and links stay on one domain.
[[redirects]]
  from = "https://dpranalyzerpro.com/*"
  to = "https://dpranalyzer.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dpranalyzerpro.com/*"
  to = "https://dpranalyzer.com/:splat"
  status = 301
  force = true

# SPA fallback — every non-asset, non-API route should serve index.html
# so React Router can take over on the client. Functions are matched
# before this redirect runs, so /api/* never falls through to here.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
